[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-memory"
version = "0.1.0"
description = "Local-first chat archives, conversation trees, AI analysis and photo calendars"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
photos = ["Pillow>=11,<13"]

[project.scripts]
wechat-memory = "wechat_memory.cli:main"
wechat-memory-app = "wechat_memory.server:main"

[tool.setuptools.packages.find]
include = ["wechat_memory*"]

[tool.setuptools.package-data]
wechat_memory = ["web/*.html", "web/*.css", "web/*.js"]
