name: Windows EXE installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['installer/**', 'scripts/build_windows_installer.py', 'scripts/test_windows_installer.py', '.github/workflows/installer.yml']
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[photos]'
      - run: python -m unittest discover -s tests -v
      - run: python -m wechat_memory.windows_exporter setup
      - run: python scripts/build_windows_installer.py
      - name: Compile setup EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test install, isolated runtime, local UI and uninstall
        run: python scripts/test_windows_installer.py
      - name: Hash installer
        shell: pwsh
        run: |
          $artifact = Get-Item dist/WeChatMemory-Setup-0.2.0-x64.exe
          $checksum = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower()
          "$checksum  $($artifact.Name)" | Set-Content -Encoding ascii dist/WeChatMemory-Setup-0.2.0-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatMemory-Installer-x64
          path: |
            dist/WeChatMemory-Setup-0.2.0-x64.exe
            dist/WeChatMemory-Setup-0.2.0-x64.exe.sha256
          if-no-files-found: error
