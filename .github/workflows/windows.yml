name: Windows launcher kit
on: [push, workflow_dispatch]
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[photos]'
      - name: Install pinned Windows extraction component
        run: python -m wechat_memory.windows_exporter setup
      - name: Verify component starts and dependencies load (no WeChat login)
        run: |
          python -c "import json; from wechat_memory.windows_exporter import WindowsExporter; from wechat_memory.storage import ArchiveStore; s=WindowsExporter(ArchiveStore()).status(); print(json.dumps(s)); assert s['installed']; assert not s.get('missing_dependencies', ['check failed'])"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_windows_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatMemory-Windows
          path: dist/WeChatMemory-Windows.zip
